{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="{% static 'chat/logRegPhone.css' %}">
</head>

<body>

<div class="form-container">

    <h2>Login</h2>

    <p class="subtitle">
        Access your private chat dashboard.
    </p>

    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="additional-links">

        <p>
            Don't have an account?
            <a href="{% url 'chat:register' %}">
                Create one
            </a>
        </p>

    </div>

</div>

</body>
</html>
