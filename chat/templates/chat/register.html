{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link rel="stylesheet" href="{% static 'chat/logRegPhone.css' %}">
</head>

<body>

<div class="form-container">

    <h2>Create Account</h2>

    <p class="subtitle">
        Create private temporary chat rooms instantly.
    </p>

    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    {% if success %}
        <div class="success-message">
            {{ success }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Choose username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Create password"
            required
        >

        <input
            type="password"
            name="password_confirm"
            placeholder="Confirm password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="additional-links">

        <p>
            Already have an account?
            <a href="{% url 'chat:login' %}">
                Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
